# Only here to build the #1117 CLI fix on Linux in this fork. Not part of the fix.
name: Linux build of the CLI fix for 3mf without project settings
on:
  push:
    branches: [ci/cli-1117-linux]
jobs:
  linux:
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ubuntu-24.04
      build-deps-only: false
    secrets: inherit
